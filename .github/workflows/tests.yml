name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cask: ${{ steps.filter.outputs.cask }}
      formula: ${{ steps.filter.outputs.formula }}
    steps:
      - if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE_SHA..$HEAD_SHA")"
          fi

          if [ -z "$changed" ]; then
            echo "cask=true" >> "$GITHUB_OUTPUT"
            echo "formula=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Changed files:\n%s\n' "$changed"
          has_cask="false"
          has_formula="false"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              Casks/*)
                has_cask="true"
                ;;
              *.md)
                ;;
              *)
                has_formula="true"
                ;;
            esac
          done <<< "$changed"

          if [ "$has_cask" = "false" ] && [ "$has_formula" = "false" ]; then
            has_cask="true"
          fi

          echo "cask=$has_cask" >> "$GITHUB_OUTPUT"
          echo "formula=$has_formula" >> "$GITHUB_OUTPUT"

  cask:
    needs: changes
    if: needs.changes.outputs.cask == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/homebrew/brew:main
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-latest-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Verify Cask release archives and checksums
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          brew ruby -e '
            require "cask/cask_loader"
            require "digest"
            require "open-uri"
            Dir.glob("Casks/*.rb").sort.each do |path|
              cask = Cask::CaskLoader::FromPathLoader.new(Pathname(path)).load(config: nil)
              next if cask.sha256 == :no_check

              expected = cask.sha256.hexdigest
              url = cask.url.to_s
              puts "Checking #{path}: #{url}"
              digest = Digest::SHA256.new
              URI.open(url) do |io|
                while (buf = io.read(65_536))
                  digest << buf
                end
              end
              actual = digest.hexdigest
              abort("SHA256 mismatch for #{path}: expected #{expected}, got #{actual}") unless actual == expected
            end
          '

  test-bot:
    needs: changes
    if: needs.changes.outputs.formula == 'true'
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Install the Python test runtime
        run: |
          brew install python@3.12
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"

      - name: Check formula option selection and release synchronization
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          brew ruby tests/formula_options.rb
          brew ruby tests/wheel_linkage.rb
          python3 scripts/sync_remove_ai_watermarks.py --check

      - name: Install and test the default image profile
        run: |
          brew install --build-from-source wiltodelta/tap/remove-ai-watermarks
          brew test wiltodelta/tap/remove-ai-watermarks

      - name: Install and test the base-only profile
        run: |
          brew reinstall --build-from-source wiltodelta/tap/remove-ai-watermarks --without-default-extras
          brew test wiltodelta/tap/remove-ai-watermarks

      - name: Install and test the Seedance dependency profile
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          brew reinstall --build-from-source wiltodelta/tap/remove-ai-watermarks --with-video --with-diffusion
          brew test wiltodelta/tap/remove-ai-watermarks

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
