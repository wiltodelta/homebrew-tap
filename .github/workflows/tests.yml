name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Install the Python test runtime
        run: |
          brew install python@3.12
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"

      - name: Check formula option selection and release synchronization
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          brew ruby tests/formula_options.rb
          brew ruby tests/wheel_linkage.rb
          python3 scripts/sync_remove_ai_watermarks.py --check

      - name: Install and test the default image profile
        run: |
          brew install --build-from-source wiltodelta/tap/remove-ai-watermarks
          brew test wiltodelta/tap/remove-ai-watermarks

      - name: Install and test the base-only profile
        run: |
          brew reinstall --build-from-source wiltodelta/tap/remove-ai-watermarks --without-default-extras
          brew test wiltodelta/tap/remove-ai-watermarks

      - name: Install and test the video profile
        if: matrix.os == 'macos-15-intel'
        run: |
          brew reinstall --build-from-source wiltodelta/tap/remove-ai-watermarks --with-video
          brew test wiltodelta/tap/remove-ai-watermarks

      - name: Install and test the Seedance dependency profile
        if: matrix.os != 'macos-15-intel'
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          brew reinstall --build-from-source wiltodelta/tap/remove-ai-watermarks --with-video --with-diffusion
          brew test wiltodelta/tap/remove-ai-watermarks

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
